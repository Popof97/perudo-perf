<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perudo Master — PERF</title>
  <style>
    :root { --ink:#10251f; --paper:#f6f1e5; --cream:#fffaf0; --green:#176b54; --green-dark:#0d4034; --coral:#e7604b; --gold:#e4ad3b; --line:#d9cfbb; --muted:#6f796f; font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 10% 0%,#fdf5dc 0 14%,transparent 35%), #e9e2d2; }
    button,input,select { font:inherit; } button { cursor:pointer; border:0; } .shell { max-width:1120px; margin:auto; padding:24px 20px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:8px 0 28px; } .brand { display:flex; gap:12px; align-items:center; } .dice { width:46px; height:46px; display:grid; place-items:center; background:var(--coral); color:white; border-radius:15px 15px 15px 3px; box-shadow:5px 5px 0 #b84337; font-size:25px; }
    .brand h1 { margin:0; font-size:24px; letter-spacing:-.8px; } .brand p { margin:2px 0 0; color:var(--muted); font-size:13px; } .season-pill { background:var(--ink); color:#fff; padding:10px 13px; border-radius:999px; font-weight:700; }
    nav { display:flex; background:#dcd3c1; padding:5px; border-radius:16px; gap:4px; margin-bottom:25px; } nav button { flex:1; background:transparent; padding:11px 8px; color:#506055; border-radius:12px; font-weight:800; } nav button.active { background:var(--cream); color:var(--green-dark); box-shadow:0 2px 8px #766c5a2b; }
    .hero { background:var(--green-dark); color:#fff; border-radius:28px; padding:30px; position:relative; overflow:hidden; min-height:205px; } .hero:after { content:""; position:absolute; width:250px; height:250px; border:34px dotted #ffffff15; border-radius:50%; right:-80px; top:-130px; } .hero h2 { font-size:31px; margin:0 0 8px; letter-spacing:-1px; max-width:590px; position:relative; z-index:1; } .hero p { color:#cae4d8; max-width:530px; margin:0; line-height:1.5; position:relative; z-index:1; } .hero strong { color:#ffd675; } .hero-badge { position:absolute; z-index:1; width:220px; right:20px; bottom:-73px; transform:rotate(5deg); border:5px solid #f4d078; border-radius:22px; box-shadow:0 14px 30px #001d16a8; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; }.metric { background:var(--cream); border:1px solid var(--line); padding:16px; border-radius:18px; }.metric b { display:block; font-size:23px; }.metric span { color:var(--muted); font-size:13px; }
    .section-head { display:flex; justify-content:space-between; align-items:end; margin:29px 0 12px; gap:12px; } h3 { margin:0; font-size:20px; } .sub { margin:3px 0 0; color:var(--muted); font-size:13px; }.button { background:var(--green); color:#fff; padding:12px 15px; border-radius:13px; font-weight:800; box-shadow:0 3px 0 var(--green-dark); }.button.alt { background:var(--gold); color:#482d00; box-shadow:0 3px 0 #ba851d; }.button:active { transform:translateY(2px); box-shadow:none; }
    .ranking { display:grid; gap:10px; }.player { display:grid; grid-template-columns:46px 1fr auto; gap:13px; align-items:center; background:var(--cream); border:1px solid var(--line); padding:13px 16px; border-radius:19px; }.player.clickable { cursor:pointer; transition:transform .15s, box-shadow .15s; }.player.clickable:hover { transform:translateY(-2px); box-shadow:0 8px 18px #6e614523; }.place-wrap { display:grid; justify-items:center; gap:3px; }.place { display:grid; place-items:center; width:38px; height:38px; background:#e5dcc8; border-radius:12px; font-weight:900; }.rank-trend { font-size:11px; font-weight:900; white-space:nowrap; }.rank-trend.up,.score-trend.up { color:#118653; }.rank-trend.down,.score-trend.down { color:#c64b3e; }.rank-trend.flat,.score-trend.flat { color:var(--muted); }.player:nth-child(1) .place { background:var(--gold); }.player:nth-child(2) .place { background:#cfd6d5; }.player:nth-child(3) .place { background:#df9d68; }.player-name { font-size:16px; font-weight:900; }.player-meta { color:var(--muted); font-size:13px; margin-top:3px; }.perf { text-align:right; }.perf b { font-size:25px; }.perf small { display:block; color:var(--muted); font-weight:700; }.score-trend { font-size:11px; font-weight:900; margin-top:2px; }
    .stat-switch { display:flex; gap:7px; background:#e5dcc8; padding:5px; border-radius:14px; }.stat-switch button { padding:8px 11px; border-radius:10px; background:transparent; color:var(--muted); font-weight:900; }.stat-switch button.active { background:var(--cream); color:var(--green-dark); box-shadow:0 2px 6px #6e61452b; }.stat-list { display:grid; gap:9px; }.stat-row { display:grid; grid-template-columns:minmax(115px,1.4fr) repeat(4,minmax(54px,.7fr)); gap:8px; align-items:center; padding:13px 15px; background:var(--cream); border:1px solid var(--line); border-radius:17px; cursor:pointer; }.stat-row:hover { border-color:#b6a98f; }.stat-row b { display:block; }.stat-row span { display:block; font-size:12px; color:var(--muted); }.stat-number { text-align:center; font-weight:900; font-size:18px; }.stat-number small { display:block; font-size:10px; font-weight:700; color:var(--muted); }.personal-columns { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }.personal-card { background:#fffdf7; border:1px solid var(--line); border-radius:17px; padding:15px; }.personal-card h4 { margin:0 0 12px; font-size:14px; }.personal-card dl { margin:0; display:grid; grid-template-columns:1fr auto; gap:9px; }.personal-card dt { color:var(--muted); }.personal-card dd { margin:0; font-weight:900; }
    .notice,.empty { background:#fff4d5; border:1px solid #efd99d; padding:14px 16px; border-radius:15px; color:#775616; line-height:1.45; }.empty { color:var(--muted); background:var(--cream); border-color:var(--line); text-align:center; padding:30px; }
    .games { display:grid; gap:9px; }.game { padding:14px 16px; background:var(--cream); border:1px solid var(--line); border-radius:16px; display:flex; justify-content:space-between; gap:15px; align-items:center; }.game b { display:block; }.game span { color:var(--muted); font-size:13px; }.tag { background:#dbf0e6; color:#176b54; border-radius:999px; padding:5px 9px; font-size:12px; font-weight:900; white-space:nowrap; }
    .hidden { display:none!important; }.panel { background:var(--cream); border:1px solid var(--line); border-radius:22px; padding:20px; }.toolbar { display:flex; gap:9px; flex-wrap:wrap; }.tool { padding:10px 12px; background:#e7dfcf; color:var(--ink); border-radius:12px; font-weight:800; }.tool.danger { color:#a6382b; background:#ffe1dc; }
    .modal { position:fixed; inset:0; background:#10251f99; display:grid; place-items:center; padding:18px; z-index:4; }.modal-box { max-height:90vh; overflow:auto; width:min(600px,100%); background:var(--paper); border-radius:25px; padding:23px; box-shadow:0 20px 70px #00180d66; }.modal-head { display:flex; justify-content:space-between; align-items:start; gap:10px; }.close { background:#ded7c8; width:34px; height:34px; border-radius:50%; font-size:20px; }.form-row { margin-top:17px; }.form-row label { display:block; font-size:13px; font-weight:900; margin-bottom:6px; }.form-row input,.form-row select { width:100%; border:1px solid var(--line); border-radius:11px; padding:11px; background:#fffdf7; color:var(--ink); }.picker { display:grid; gap:7px; }.pick { display:flex; align-items:center; gap:9px; padding:10px; border:1px solid var(--line); border-radius:12px; background:#fffdf7; }.pick input { width:auto; }.order { display:grid; gap:7px; }.order-item { display:flex; align-items:center; justify-content:space-between; background:#fffdf7; border:1px solid var(--line); border-radius:12px; padding:10px; }.order-item span { font-weight:900; }.order-item button { width:34px; height:30px; background:#e9e0d0; border-radius:8px; font-weight:900; }.modal-actions { display:flex; justify-content:end; gap:9px; margin-top:22px; }.cancel { padding:11px 13px; border-radius:12px; background:#e4dccc; color:var(--ink); font-weight:800; }
    .season-card { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border:1px solid var(--line); border-radius:17px; background:#fffdf7; margin-top:9px; }.season-card b { display:block; }.season-card span { color:var(--muted); font-size:13px; }
    @media(max-width:620px){ .shell{padding:16px 14px 45px}.season-pill{font-size:12px}.hero{padding:23px;min-height:255px}.hero h2{font-size:26px}.hero-badge{width:145px;right:9px;bottom:-43px}.hero p{max-width:270px}.summary{grid-template-columns:1fr}.player{grid-template-columns:36px 1fr auto;padding:12px}.perf b{font-size:21px}.game{align-items:start;flex-direction:column}.section-head{align-items:start;flex-direction:column}.button{width:100%}.stat-row{grid-template-columns:1fr repeat(2,1fr)}.stat-row .stat-number:nth-last-child(-n+2){margin-top:4px}.personal-columns{grid-template-columns:1fr} }
  </style>
</head>
<body><div class="shell">
  <header><div class="brand"><div class="dice">⚄</div><div><h1>Perudo Master</h1><p>Le classement de la bande, sans ELO.</p></div></div><div class="toolbar"><div class="season-pill" id="seasonName">Saison 2026</div><button class="tool" id="authButton" onclick="openLogin()">Se connecter</button></div></header>
  <nav><button class="active" data-view="rank">Classement</button><button data-view="games">Parties</button><button data-view="stats">Statistiques</button><button data-view="seasons">Saisons</button></nav>
  <main id="app"></main>
</div>
<div class="modal hidden" id="modal"><div class="modal-box" id="modalContent"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wvqbzzpqcksgplzjohbe.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_pfgDSoALVq2TgkiQCbOeJQ_68VMcNR9';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const PERFECT_WIN_BONUS = 5;
  let data, activeSeasonId, view='rank', statsScope='season', selectedIds=[], order=[], accessCode=localStorage.getItem('perudoAccessCode')||'', writerDb=null;
  const $ = (s) => document.querySelector(s);
  const uid = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  const activeSeason = () => data.seasons.find(s=>s.id===activeSeasonId) || data.seasons[0];
  const pointsFor = (count, position) => 2.5*count - (5*count/(count-1))*position;
  const performance = (player, season) => { const pts=season.games.filter(g=>g.ranks.includes(player.id)).map(g=>pointsFor(g.ranks.length,g.ranks.indexOf(player.id))+(g.perfectWin&&g.ranks.indexOf(player.id)===0?PERFECT_WIN_BONUS:0)); const avg=pts.length?pts.reduce((a,b)=>a+b,0)/pts.length:0; return {games:pts.length, score:Math.max(0,Math.min(100,50+avg)), avg}; };
  const sortedPlayers = (season=activeSeason()) => season.players.map(p=>({...p,...performance(p,season)})).sort((a,b)=>b.score-a.score || b.games-a.games || a.name.localeCompare(b.name));
  const dateText = (iso) => new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso));
  async function loadData(){
    const [seasonResponse, playerResponse, rosterResponse, gameResponse, resultResponse] = await Promise.all([
      db.from('seasons').select('*').order('created_at'), db.from('players').select('*'), db.from('season_players').select('*'), db.from('games').select('*'), db.from('game_results').select('*')
    ]);
    const error = [seasonResponse,playerResponse,rosterResponse,gameResponse,resultResponse].find(r=>r.error)?.error;
    if(error) throw error;
    const playersById = Object.fromEntries(playerResponse.data.map(p=>[p.id,{id:p.id,name:p.name,avatar:p.avatar}]));
    data = {seasons:seasonResponse.data.map(s=>{
      const playerIds=rosterResponse.data.filter(r=>r.season_id===s.id).map(r=>r.player_id);
      const games=gameResponse.data.filter(g=>g.season_id===s.id).map(g=>({id:g.id,date:g.played_at,perfectWin:!!g.perfect_win,ranks:resultResponse.data.filter(r=>r.game_id===g.id).sort((a,b)=>a.finish_position-b.finish_position).map(r=>r.player_id)}));
      return {id:s.id,name:s.name,status:s.status,createdAt:s.created_at,players:playerIds.map(id=>playersById[id]).filter(Boolean),games};
    })};
  }
  function prepareWriter(){ writerDb=accessCode?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{global:{headers:{'x-perudo-code':accessCode}}}):null; }
  function requireAuth(){ if(writerDb) return true; openLogin(); return false; }
  function renderAuth(){ const button=$('#authButton'); if(!button)return; button.textContent=writerDb?'Code actif':'Entrer le code'; button.onclick=writerDb?signOut:openLogin; }
  function esc(value){ return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function rankingHtml(){ const s=activeSeason(), ranked=sortedPlayers(s), official=ranked.filter(p=>p.games>=5), waiting=ranked.filter(p=>p.games<5), canEdit=s.status==='active'; return `
    <section class="hero"><h2>Des dés, du bluff, et une mauvaise foi impeccable.</h2><p>La <strong>PERF</strong> se souvient de tout — même du fameux « j’étais sûr qu’il mentait ». 50 représente le niveau moyen ; les grandes tables comptent davantage.</p><img class="hero-badge" src="perudo-classement-badge.png" alt="Écusson Perudo Classement"></section>
    <section class="summary"><div class="metric"><b>${s.games.length}</b><span>parties jouées</span></div><div class="metric"><b>${s.players.length}</b><span>joueurs inscrits</span></div><div class="metric"><b>5</b><span>parties pour être classé</span></div></section>
    <div class="section-head"><div><h3>Classement officiel</h3><p class="sub">Au moins 5 parties jouées</p></div>${canEdit?'<button class="button" onclick="openGame()">+ Ajouter une partie</button>':''}</div>
    ${official.length?`<div class="ranking">${official.map((p,i)=>playerHtml(p,i+1)).join('')}</div>`:`<div class="empty">Le classement officiel apparaîtra dès qu’un joueur aura participé à 5 parties.</div>`}
    ${waiting.length?`<div class="section-head"><div><h3>En cours de qualification</h3><p class="sub">Leurs résultats comptent déjà, mais ils n’apparaissent pas encore au classement officiel.</p></div></div><div class="ranking">${waiting.map(p=>playerHtml(p,'•')).join('')}</div>`:''}
  `; }
  function standingsFor(season,games){ return sortedPlayers({...season,games}).filter(p=>p.games>=5); }
  function latestGame(season){ return [...season.games].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]; }
  function evolutionFor(player){ const season=activeSeason(),latest=latestGame(season);if(!latest)return null;const previousGames=season.games.filter(g=>g.id!==latest.id);const current=standingsFor(season,season.games),previous=standingsFor(season,previousGames);const currentPlace=current.findIndex(p=>p.id===player.id);const oldPlace=previous.findIndex(p=>p.id===player.id);const oldScore=performance(player,{...season,games:previousGames}).score;return {rankMove:oldPlace<0?null:oldPlace-currentPlace,scoreMove:player.score-oldScore,playedLatest:latest.ranks.includes(player.id)}; }
  function playerHtml(p,place){ const trend=evolutionFor(p);const rankLabel=!trend?'':trend.rankMove===null?'Nouveau':trend.rankMove>0?`▲ ${trend.rankMove}`:trend.rankMove<0?`▼ ${Math.abs(trend.rankMove)}`:'—';const rankClass=!trend?'flat':trend.rankMove===null?'up':trend.rankMove>0?'up':trend.rankMove<0?'down':'flat';const scoreLabel=!trend?'':`${trend.scoreMove>0?'+':''}${trend.scoreMove.toFixed(1)} après la dernière partie`;const scoreClass=!trend?'flat':trend.scoreMove>0?'up':trend.scoreMove<0?'down':'flat';return `<article class="player clickable" onclick="openPlayerStats('${p.id}')"><div class="place-wrap"><div class="place">${place}</div>${trend?`<span class="rank-trend ${rankClass}">${rankLabel}</span>`:''}</div><div><div class="player-name">${esc(p.avatar||'🎲')} ${esc(p.name)}</div><div class="player-meta">${p.games} partie${p.games>1?'s':''}${p.games<5?` · encore ${5-p.games} pour être classé`:''}</div></div><div class="perf"><b>${p.score.toFixed(1)}</b><small>PERF / 100</small>${trend?`<div class="score-trend ${scoreClass}">${scoreLabel}</div>`:''}</div></article>`; }
  function allGames(){ return data.seasons.flatMap(s=>s.games); }
  function allPlayers(){ const known=new Map();data.seasons.forEach(s=>s.players.forEach(p=>known.set(p.id,p)));return [...known.values()]; }
  function playerStats(id,games){ const played=games.filter(g=>g.ranks.includes(id));const wins=played.filter(g=>g.ranks.indexOf(id)===0).length;const seconds=played.filter(g=>g.ranks.indexOf(id)===1).length;const lasts=played.filter(g=>g.ranks.indexOf(id)===g.ranks.length-1).length;return {games:played.length,wins,seconds,lasts,winRate:played.length?wins/played.length*100:0}; }
  function statNumber(value,label){return `<div class="stat-number">${value}<small>${label}</small></div>`;}
  function statsHtml(){ const scopeGames=statsScope==='season'?activeSeason().games:allGames();const players=statsScope==='season'?activeSeason().players:allPlayers();const rows=players.map(p=>({...p,...playerStats(p.id,scopeGames)})).sort((a,b)=>b.wins-a.wins||b.winRate-a.winRate||b.games-a.games);return `<div class="section-head"><div><h3>Statistiques</h3><p class="sub">Clique sur un joueur pour ouvrir sa fiche personnelle.</p></div><div class="stat-switch"><button class="${statsScope==='season'?'active':''}" onclick="setStatsScope('season')">Cette saison</button><button class="${statsScope==='lifetime'?'active':''}" onclick="setStatsScope('lifetime')">À vie</button></div></div>${rows.length?`<div class="stat-list">${rows.map(p=>`<article class="stat-row" onclick="openPlayerStats('${p.id}')"><div><b>${esc(p.avatar||'🎲')} ${esc(p.name)}</b><span>${p.games} partie${p.games>1?'s':''}</span></div>${statNumber(p.wins,'victoires')}${statNumber(p.seconds,'2e places')}${statNumber(p.lasts,'dernières')}${statNumber(p.winRate.toFixed(0)+'%','de victoires')}</article>`).join('')}</div>`:`<div class="empty">Pas encore de statistiques : ajoute une partie pour commencer.</div>`}`; }
  function setStatsScope(scope){statsScope=scope;render();}
  function personalCard(title,stats){return `<div class="personal-card"><h4>${title}</h4><dl><dt>Parties jouées</dt><dd>${stats.games}</dd><dt>Victoires</dt><dd>${stats.wins}</dd><dt>Deuxièmes places</dt><dd>${stats.seconds}</dd><dt>Dernières places</dt><dd>${stats.lasts}</dd><dt>Pourcentage de victoires</dt><dd>${stats.winRate.toFixed(1)}%</dd></dl></div>`;}
  function openPlayerStats(id){const p=allPlayers().find(x=>x.id===id);if(!p)return;showModal(`<div class="modal-head"><div><h3>${esc(p.avatar||'🎲')} ${esc(p.name)}</h3><p class="sub">Sa fiche Perudo Master.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="personal-columns">${personalCard('Cette saison',playerStats(id,activeSeason().games))}${personalCard('Toute l’histoire',playerStats(id,allGames()))}</div>`);}
  function gamesHtml(){ const s=activeSeason(), games=[...s.games].sort((a,b)=>new Date(b.date)-new Date(a.date)), editable=s.status==='active'&&writerDb; return `<div class="section-head"><div><h3>Toutes les parties</h3><p class="sub">Chaque résultat est calculé automatiquement, sans ELO.</p></div>${s.status==='active'?'<button class="button" onclick="openGame()">+ Ajouter une partie</button>':''}</div>${games.length?`<div class="games">${games.map(g=>{const names=g.ranks.map(id=>s.players.find(p=>p.id===id)?.name||'Joueur').join(' · ');return `<article class="game"><div><b>${g.ranks.length} joueurs · ${dateText(g.date)}</b><span>🏆 ${esc(names)}</span></div><div class="toolbar"><div class="tag">PERF calculée</div>${g.perfectWin?'<div class="tag">🎯 Vol parfait +5</div>':''}${editable?`<button class="tool danger" onclick="deleteGame('${g.id}')">Supprimer</button>`:''}</div></article>`}).join('')}</div>`:`<div class="empty">Pas encore de partie. Ajoute la première quand vous aurez fini de jouer.</div>`}`; }
  function seasonsHtml(){ const editing=activeSeason().status==='active'; return `<div class="section-head"><div><h3>Les saisons</h3><p class="sub">Une saison terminée reste visible, sans pouvoir être modifiée.</p></div><button class="button alt" onclick="openSeason()">+ Nouvelle saison</button></div><div class="panel">${data.seasons.map(s=>`<div class="season-card"><div><b>${esc(s.name)} ${s.status==='active'?'· en cours':'· archivée'}</b><span>${s.games.length} parties · ${s.players.length} joueurs</span></div><div class="toolbar">${s.id!==activeSeasonId?`<button class="tool" onclick="selectSeason('${s.id}')">Voir</button>`:''}${s.status==='active'?`<button class="tool danger" onclick="archiveSeason('${s.id}')">Clôturer</button>`:''}</div></div>`).join('')}</div>${editing?`<div class="section-head"><div><h3>Les joueurs</h3><p class="sub">Ajoute une personne avant ou après une soirée de jeu.</p></div><button class="button" onclick="openPlayer()">+ Ajouter un joueur</button></div>`:''}<div class="section-head"><div><h3>Importation de l’ancienne sauvegarde</h3><p class="sub">Elle transforme tes anciennes parties en PERF. Les nombres ELO sont ignorés.</p></div></div>${editing?`<div class="panel"><input type="file" id="legacyFile" accept="application/json"><p class="sub">Choisis le fichier <b>perudo_master_backup…json</b> que tu m’as donné.</p><button class="button" onclick="importLegacy()">Importer dans cette saison</button></div>`:''}`; }
  function render(){ const s=activeSeason(); $('#seasonName').textContent=s.name; $('#app').innerHTML=view==='rank'?rankingHtml():view==='games'?gamesHtml():view==='stats'?statsHtml():seasonsHtml(); document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); renderAuth(); }
  function showModal(html){ $('#modalContent').innerHTML=html; $('#modal').classList.remove('hidden'); } function closeModal(){ $('#modal').classList.add('hidden'); }
  function openGame(){ const s=activeSeason(); if(s.status!=='active')return alert('Cette saison est clôturée : ses résultats restent visibles, mais ne peuvent plus être modifiés.'); if(s.players.length<2) return openPlayer(); selectedIds=[];order=[]; showModal(`<div class="modal-head"><div><h3>Ajouter une partie</h3><p class="sub">Choisis les personnes qui ont joué, puis leur ordre d’arrivée.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-row"><label>Date</label><input id="gameDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-row"><label>Les joueurs présents</label><div class="picker">${s.players.map(p=>`<label class="pick"><input type="checkbox" value="${p.id}" onchange="togglePlayer('${p.id}',this.checked)"><span>${esc(p.avatar||'🎲')} ${esc(p.name)}</span></label>`).join('')}</div></div><div class="form-row" id="orderArea"></div><div class="form-row"><label class="pick"><input id="perfectWin" type="checkbox"><span>🎯 Vol parfait : le gagnant termine avec ses 5 dés (+${PERFECT_WIN_BONUS} points PERF)</span></label></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Annuler</button><button class="button" onclick="saveGame()">Enregistrer</button></div>`); }
  function togglePlayer(id,checked){ selectedIds=checked?[...selectedIds,id]:selectedIds.filter(x=>x!==id); order=order.filter(x=>x!==id); selectedIds.forEach(id=>{if(!order.includes(id))order.push(id)}); renderOrder(); }
  function renderOrder(){ const s=activeSeason(),area=$('#orderArea'); if(!area)return; area.innerHTML=selectedIds.length<2?`<label>Ordre d’arrivée</label><p class="sub">Choisis au moins deux joueurs.</p>`:`<label>Ordre d’arrivée</label><div class="order">${order.map((id,i)=>{const p=s.players.find(x=>x.id===id);return `<div class="order-item"><span>${i+1}. ${esc(p.avatar||'🎲')} ${esc(p.name)}</span><div><button ${i===0?'disabled':''} onclick="moveOrder(${i},-1)">↑</button><button ${i===order.length-1?'disabled':''} onclick="moveOrder(${i},1)">↓</button></div></div>`}).join('')}</div>`; }
  function moveOrder(i,d){ [order[i],order[i+d]]=[order[i+d],order[i]];renderOrder(); }
  async function saveGame(){ if(!requireAuth())return;if(order.length<2)return alert('Choisis au moins deux joueurs.');try{const game={id:uid('game'),season_id:activeSeason().id,played_at:new Date($('#gameDate').value+'T12:00:00').toISOString(),perfect_win:$('#perfectWin').checked};let response=await writerDb.from('games').insert(game);if(response.error)throw response.error;response=await writerDb.from('game_results').insert(order.map((player_id,finish_position)=>({game_id:game.id,player_id,finish_position:finish_position+1})));if(response.error)throw response.error;await loadData();closeModal();render();}catch(error){alert('Impossible d’enregistrer cette partie : '+error.message);} }
  function openPlayer(){ showModal(`<div class="modal-head"><div><h3>Ajouter les joueurs</h3><p class="sub">Ajoute au moins deux personnes pour enregistrer une partie.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-row"><label>Prénom</label><input id="playerName" placeholder="Ex. Christophe"></div><div class="form-row"><label>Petit symbole (facultatif)</label><input id="playerAvatar" value="🎲" maxlength="4"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Annuler</button><button class="button" onclick="savePlayer()">Ajouter</button></div>`); }
  async function savePlayer(){ if(!requireAuth())return;const name=$('#playerName').value.trim();if(!name)return alert('Écris au moins un prénom.');try{const player={id:uid('player'),name,avatar:$('#playerAvatar').value.trim()||'🎲'};let response=await writerDb.from('players').insert(player);if(response.error)throw response.error;response=await writerDb.from('season_players').insert({season_id:activeSeason().id,player_id:player.id});if(response.error)throw response.error;await loadData();closeModal();render();}catch(error){alert('Impossible d’ajouter ce joueur : '+error.message);} }
  function openSeason(){ showModal(`<div class="modal-head"><div><h3>Créer une nouvelle saison</h3><p class="sub">Les joueurs sont copiés. Les parties repartent à zéro.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-row"><label>Nom de la saison</label><input id="newSeasonName" value="Saison ${new Date().getFullYear()+1}"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Annuler</button><button class="button" onclick="saveSeason()">Créer</button></div>`); }
  async function saveSeason(){ if(!requireAuth())return;const name=$('#newSeasonName').value.trim();if(!name)return alert('Donne un nom à la saison.');try{const current=activeSeason(),fresh={id:uid('season'),name,status:'active'};let response=await writerDb.from('seasons').update({status:'archived'}).eq('id',current.id);if(response.error)throw response.error;response=await writerDb.from('seasons').insert(fresh);if(response.error)throw response.error;if(current.players.length){response=await writerDb.from('season_players').insert(current.players.map(p=>({season_id:fresh.id,player_id:p.id})));if(response.error)throw response.error;}await loadData();activeSeasonId=fresh.id;closeModal();view='rank';render();}catch(error){alert('Impossible de créer la saison : '+error.message);} }
  async function archiveSeason(id){ if(!requireAuth())return;const season=data.seasons.find(s=>s.id===id);if(!confirm(`Clôturer « ${season.name} » ? Elle ne sera plus modifiable.`))return;const response=await writerDb.from('seasons').update({status:'archived'}).eq('id',id);if(response.error)return alert(response.error.message);await loadData();render(); }
  async function deleteGame(id){ if(!requireAuth())return;const game=activeSeason().games.find(g=>g.id===id);if(!game)return;if(!confirm(`Supprimer cette partie du ${dateText(game.date)} ? Le classement sera recalculé immédiatement.`))return;const response=await writerDb.from('games').delete().eq('id',id);if(response.error)return alert('Impossible de supprimer la partie : '+response.error.message);await loadData();render(); }
  function selectSeason(id){activeSeasonId=id;view='rank';render();}
  async function createFirstSeason(){ if(!requireAuth())return;try{const response=await writerDb.from('seasons').insert({id:'season-2026',name:'Saison 2026',status:'active'});if(response.error)throw response.error;await loadData();activeSeasonId='season-2026';render();}catch(error){alert('Impossible de créer la première saison : '+error.message);} }
  async function importLegacy(){ if(!requireAuth())return;const file=$('#legacyFile').files[0];if(!file)return alert('Choisis d’abord le fichier JSON.');try{const legacy=JSON.parse(await file.text());if(!Array.isArray(legacy.players)||!Array.isArray(legacy.games))throw new Error('Cette sauvegarde ne ressemble pas à une sauvegarde Perudo.');const s=activeSeason();if(s.games.length||s.players.length){if(!confirm('Cette saison contient déjà des données. L’import ajoutera les joueurs et parties. Continuer ?'))return;}const players=legacy.players.map(p=>({id:String(p.id),name:String(p.name||'Joueur sans nom').slice(0,50),avatar:'🎲'}));let response=await writerDb.from('players').upsert(players);if(response.error)throw response.error;response=await writerDb.from('season_players').upsert(players.map(p=>({season_id:s.id,player_id:p.id})));if(response.error)throw response.error;const importedGames=legacy.games.map(g=>({id:`game-${g.id||uid('legacy')}`,season_id:s.id,played_at:g.date||new Date().toISOString(),ranks:Array.isArray(g.ranks)?g.ranks.map(r=>String(r.id)).filter(id=>players.some(p=>p.id===id)):[]})).filter(g=>g.ranks.length>=2);response=await writerDb.from('games').upsert(importedGames.map(({ranks,...g})=>g));if(response.error)throw response.error;const results=importedGames.flatMap(g=>g.ranks.map((player_id,index)=>({game_id:g.id,player_id,finish_position:index+1})));response=await writerDb.from('game_results').upsert(results);if(response.error)throw response.error;await loadData();alert(`${importedGames.length} parties ont été importées en PERF. Les données ELO ont été ignorées.`);view='rank';render();}catch(error){alert(error.message||'Importation impossible.');}}
  function openLogin(){ showModal(`<div class="modal-head"><div><h3>Entrer le code du groupe</h3><p class="sub">Une seule saisie par téléphone. Ce code permet d’ajouter des résultats, sans compte e-mail.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-row"><label>Code Perudo</label><input id="accessCode" type="password" placeholder="Le code donné par l’organisateur"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Annuler</button><button class="button" onclick="sendLoginLink()">Déverrouiller</button></div>`); }
  async function sendLoginLink(){ const entered=$('#accessCode').value.trim();if(!entered)return alert('Entre le code du groupe.');const candidate=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{global:{headers:{'x-perudo-code':entered}}});const response=await candidate.rpc('perudo_access_ok');if(response.error||!response.data)return alert('Ce code n’est pas correct.');accessCode=entered;localStorage.setItem('perudoAccessCode',accessCode);prepareWriter();closeModal();render();alert('Ce téléphone peut maintenant ajouter des parties.'); }
  function signOut(){ localStorage.removeItem('perudoAccessCode');accessCode='';prepareWriter();render(); }
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render();})); $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  (async()=>{try{prepareWriter();await loadData();activeSeasonId=data.seasons.find(s=>s.status==='active')?.id||data.seasons[0]?.id;if(activeSeasonId)render();else {renderAuth();$('#app').innerHTML=`<div class="empty"><h3>La première saison n’existe pas encore.</h3><p>Entre le code, puis crée-la une seule fois.</p><button class="button" onclick="createFirstSeason()">Créer Saison 2026</button></div>`;}}catch(error){$('#app').innerHTML=`<div class="notice">Connexion à Supabase impossible : ${esc(error.message)}</div>`;}})();
</script></body></html>
